<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar vehículo — CATO Group</title>
    <meta name="description" content="Consigná tu vehículo en CATO Group. Completá los datos, subí fotos y recibí una valoración técnica con rango estimado de precio.">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header inyectado desde partials/header.html por layout.js -->
    <div data-include="header"></div>

    <main>
        <div class="container" style="max-width: 780px;">
            <h1 class="section-title">Publicar un vehículo</h1>
            <p class="section-subtitle">Completá los datos del vehículo y subí fotos claras. Recibirás una valoración técnica con rango estimado de precio de mercado.</p>

            <div class="card">
                <div class="card-body">
                    <div id="message"></div>

                    <form id="publishForm" novalidate>
                        <h3 style="margin-bottom: 1rem; font-size: 1.05rem;">Datos generales</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="marca">Marca</label>
                                <input type="text" id="marca" placeholder="Toyota" required>
                            </div>
                            <div class="form-group">
                                <label for="modelo">Modelo</label>
                                <input type="text" id="modelo" placeholder="Corolla" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="anio">Año</label>
                                <input type="number" id="anio" min="1900" max="2026" placeholder="2020" required>
                            </div>
                            <div class="form-group">
                                <label for="kilometraje">Kilometraje</label>
                                <input type="number" id="kilometraje" min="0" placeholder="45000" required>
                            </div>
                            <div class="form-group">
                                <label for="precio">Precio (USD)</label>
                                <input type="number" id="precio" min="0" placeholder="18500" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="combustible">Combustible</label>
                                <select id="combustible" required>
                                    <option value="">Seleccionar</option>
                                    <option value="Nafta">Nafta</option>
                                    <option value="Diésel">Diésel</option>
                                    <option value="GNC">GNC</option>
                                    <option value="Híbrido">Híbrido</option>
                                    <option value="Eléctrico">Eléctrico</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="transmision">Transmisión</label>
                                <select id="transmision" required>
                                    <option value="">Seleccionar</option>
                                    <option value="Manual">Manual</option>
                                    <option value="Automática">Automática</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="ubicacion">Ubicación</label>
                                <input type="text" id="ubicacion" placeholder="Buenos Aires, CABA" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="descripcion">Descripción</label>
                            <textarea id="descripcion" placeholder="Estado general, mantenimiento realizado, detalles importantes..." required></textarea>
                        </div>

                        <h3 style="margin: 1.5rem 0 1rem; font-size: 1.05rem;">Fotografías</h3>
                        <div class="form-group">
                            <label>Imágenes del vehículo</label>

                            <!-- Grid de thumbnails: las pobla publish.js a partir
                                 de selectedPhotos[]. Vacío al inicio. -->
                            <div id="photosGrid" class="photos-grid" aria-live="polite"></div>

                            <!-- Botón visible que dispara el input oculto.
                                 Hacemos así para poder agregar fotos en varios
                                 pasos sin que el navegador reemplace la selección
                                 anterior. -->
                            <button type="button" class="btn btn-ghost" id="addPhotosBtn">
                                + Agregar fotos
                            </button>
                            <input type="file" id="imagenes" multiple accept="image/*" hidden>

                            <p class="form-hint">
                                Podés agregar fotos en distintos pasos. Arrastrá las miniaturas para
                                reordenarlas — la primera se usa como portada.
                            </p>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Publicar vehículo</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer inyectado desde partials/footer.html por layout.js -->
    <div data-include="footer"></div>

    <script src="../js/app.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/publish.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => Layout.init('publish'));
    </script>
</body>
</html>
