<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparar vehículos — CATO Group</title>
    <meta name="description" content="Compará lado a lado los vehículos seleccionados del catálogo de CATO Group: precio, año, kilometraje, combustible y equipamiento.">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header inyectado desde partials/header.html por layout.js -->
    <div data-include="header"></div>

    <main>
        <div class="container">
            <a href="cars.html" class="btn btn-ghost btn-sm" style="margin-bottom: 1rem;">← Volver al catálogo</a>
            <h1 class="section-title">Comparación de vehículos</h1>
            <p class="section-subtitle">Analizá las principales características de los autos seleccionados.</p>

            <div style="overflow-x: auto;">
                <table class="compare-table" id="compareTable">
                    <thead>
                        <tr id="compareHeader"></tr>
                    </thead>
                    <tbody id="compareBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer inyectado desde partials/footer.html por layout.js -->
    <div data-include="footer"></div>

    <script src="../js/app.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/compare.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => Layout.init('cars'));
    </script>
</body>
</html>
