<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis consultas — CATO Group</title>
    <meta name="description" content="Tu historial de consultas enviadas en CATO Group y las respuestas recibidas de los vendedores.">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header inyectado desde partials/header.html por layout.js -->
    <div data-include="header"></div>

    <main>
        <div class="container">
            <h1 class="section-title">Mis consultas</h1>
            <p class="section-subtitle">Las consultas que enviaste a los vendedores y las respuestas que te devolvieron. Podés seguir la conversación desde acá.</p>

            <div id="feedback"></div>

            <section id="consultasContainer" class="consultas-list">
                <div class="empty-state">
                    <div class="empty-icon">📨</div>
                    <h3>Cargando tus consultas...</h3>
                </div>
            </section>
        </div>
    </main>

    <!-- Footer inyectado desde partials/footer.html por layout.js -->
    <div data-include="footer"></div>

    <script src="../js/app.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/consultas-thread.js"></script>
    <script src="../js/mis-consultas.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => Layout.init('mis-consultas'));
    </script>
</body>
</html>
